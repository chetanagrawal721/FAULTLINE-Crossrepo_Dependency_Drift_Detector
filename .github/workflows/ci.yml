name: ci
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs (the tag each one was resolved from is in the trailing comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install pinned tools
        run: |
          python -m pip install uv==0.13.0
          uv sync --frozen
          npm ci --prefix frontend --no-audit --no-fund
      - name: Faultline CI (lint, pins, tests, type drift, build, boot)
        run: python tools/fl.py ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # control-plane GitHub API rate limit only; never passed into a container
      - name: Replay a committed witness bundle on this clean machine (TC-5.2.2)
        run: .venv/bin/python scripts/replay_bundle.py evidence/bundles/scenario-D-witness.zip --log release/replay.log
      - name: Release manifest (toolchain, image, lock and source hashes)
        run: .venv/bin/python scripts/release_manifest.py --out release/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            release/manifest.json
            release/replay.log
