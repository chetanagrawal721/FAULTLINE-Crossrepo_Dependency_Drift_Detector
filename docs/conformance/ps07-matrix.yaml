# Traceability matrix: every canonical MUST of the master document -> the test command that proves it -> the retained artifact.
# scripts/conformance_report.py runs each row's tests and checks that each artifact exists. A row is PASS only when its tests pass
# and every artifact path exists. `implemented: false` rows are real requirements that are NOT built yet: they are reported as
# NOT_IMPLEMENTED and block Gate D. Nothing here is waived.
version: 1
rows:
  - {id: FR-1, requirement: "Accept 1..N GitHub URLs (with optional ref); pin each to a commit SHA", phase: "M2.1-M2.4", tests: ["tests/unit/test_ingestion_urls.py", "tests/integration/test_projects_api.py"], artifact: ["evidence/M2.1/TC-2.1.1.txt", "evidence/M2.4/TC-2.4.1.txt"]}
