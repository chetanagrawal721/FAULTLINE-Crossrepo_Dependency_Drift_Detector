[project]
name = "acme-http"
version = "0.1.0"
description = "HTTP retry policies shared by the demo services (Faultline fixture, scenario C)"
requires-python = ">=3.9"
dependencies = ["urllib3>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_http"]
